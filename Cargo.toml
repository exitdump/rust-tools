[workspace]
resolver = "3"
members = ["common", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/exitdump/rust-tools"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
common = { path = "common" }

# Small, fast binaries for releases
[profile.release]
lto = true
codegen-units = 1
strip = true
